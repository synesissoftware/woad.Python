# This workflow will install Python dependencies, run tests, and smoke
# the sdist/wheel on a range of Python versions.
#
# Created: 15th August 2026
# Updated: 15th August 2026
#

name: Python package

on:
  push:
    branches:
      - boilerplate
      - dev
      - idiomatic
      - master
      - rc1
      - rc2
      - rc3
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
    - name: Checking out code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        python -m pip install -e .

    - name: Test with pytest
      run: |
        pytest

    - name: Build and install smoke
      run: |
        python -m pip install build
        python -m build
        python -m pip install dist/woad-*.whl
        python -c "import woad; assert woad.__version__ == '0.0.1'; print(woad.__version__)"

  build-py27:

    runs-on: ubuntu-latest
    container:
      image: python:2.7-slim
    steps:
    - uses: actions/checkout@v4
    - name: Compile library modules
      run: |
        python -m compileall woad
    - name: Test with unittest
      run: |
        python -m unittest discover -s tests
      env:
        PYTHONPATH: ${{ github.workspace }}
